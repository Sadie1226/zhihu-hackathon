<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T/S/P/F 采用版预览</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;color:#30382b;background:#eeeae0}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:24px;margin:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}#actor{position:relative;aspect-ratio:1;background:#dce2d6;image-rendering:pixelated;border:1px solid #c2cbb9;border-radius:8px}#actor img{position:absolute;width:100%;height:100%;inset:0}label{display:block;margin-bottom:12px}select{display:block;font:inherit;padding:10px;min-height:44px;width:100%;margin-top:4px}.card{background:#fffaf0;padding:18px;border-radius:8px}pre{white-space:pre-wrap;font-size:13px}small{color:#646d5b}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:12px}}</style><main><h1>T / S / P / F · 采用版穿搭</h1><p><small>已批准服装r2 · 本页为新契约联调输入，不提交当前旧API</small></p><div class="layout"><div id="actor" aria-label="实际叠层角色"></div><section class="card"><label>T 套装<select id="outfit" aria-label="T 套装"></select></label><label>S 衣服<select id="cloth" aria-label="S 衣服"></select></label><label>P 饰品<select id="accessory" aria-label="P 饰品"></select></label><label>F 表情<select id="face" aria-label="F 表情"></select></label><p id="status" role="status">加载中</p><pre id="selection"></pre><p>不允许裸装；T与S/P双向互斥；每类最多一件；F09已从选项删除。</p></section></div></main><script type="module">
const spec=await(await fetch('./wardrobe.json')).json(),all=[...spec.items,...spec.expressions],items=Object.fromEntries(all.map(r=>[r.id,r]));let value={...spec.modeRules.default},revision=0;const selects={};for(const[key,prefix,title]of [['outfit','T','选套装会替换衣服与饰品'],['cloth','S','选衣服会替换套装'],['accessory','P','不戴饰品'],['face','F','']]){const el=document.querySelector('#'+key);selects[key]=el;if(key!=='face'){const option=document.createElement('option');option.value='';option.textContent=title;el.append(option)}for(const row of all.filter(r=>r.id.startsWith(prefix))){const o=document.createElement('option');o.value=row.id;o.textContent=row.id+' '+(row.name||'');el.append(o)}el.onchange=()=>{const selected=el.value||null;if(key==='outfit'&&selected)value={...value,outfit:selected,cloth:null,accessory:null};else if(key==='cloth'&&selected)value={...value,outfit:null,cloth:selected};else if(key==='accessory'&&!value.outfit)value={...value,accessory:selected};else if(key==='face')value={...value,face:selected};render()}}
async function render(){const rev=++revision;for(const[k,el]of Object.entries(selects))el.value=value[k]||'';selects.accessory.disabled=!!value.outfit;const acc=items[value.accessory],expression=value.face==='F01-neutral'?null:items[value.face].layer;const layers=[acc?.renderPosition==='behind-body'?acc.layer:null,expression?spec.expressionBase:spec.base,expression,items[value.outfit||value.cloth].layer,acc&&acc.renderPosition!=='behind-body'?acc.layer:null].filter(Boolean);const imgs=await Promise.all(layers.map(async src=>{const img=new Image();img.src=src;img.alt=src;await img.decode();return img}));if(rev!==revision)return;document.querySelector('#actor').replaceChildren(...imgs);document.querySelector('#selection').textContent=JSON.stringify(value,null,2);document.querySelector('#status').textContent='已穿好 · '+(value.outfit?'套装模式，饰品不可叠加':'衣服模式，最多一件饰品');}
render();
</script></html>
